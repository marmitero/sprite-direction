name: P2 Sprite Pipeline CI
on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements-p2.txt"
      - ".github/workflows/p2-pipeline-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "requirements-p2.txt"
      - ".github/workflows/p2-pipeline-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-p2.txt
      - run: python -m compileall -q tools/sprite_pipeline.py tests/test_sprite_pipeline.py
      - run: python -m unittest discover -s tests -v
