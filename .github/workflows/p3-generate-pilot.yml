name: Legacy P3 Geometry Tests (Archived, Non-Production)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-p2.txt
      - run: python -m unittest discover -s tests -v
      - run: echo "Legacy geometric art is rejected and must not be published as production assets."
